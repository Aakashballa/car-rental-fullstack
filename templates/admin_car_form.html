
{% extends 'base.html' %}
{% block title %}{{ 'Edit Car' if car else 'Add Car' }} | RentalX{% endblock %}
{% block content %}
<div class="form-card wide">
  <h1>{{ 'Edit Car' if car else 'Add New Car' }}</h1>
  <form method="post">
    <label>Name</label>
    <input type="text" name="name" value="{{ car.name if car else '' }}" required>
    <label>Category</label>
    <input type="text" name="category" value="{{ car.category if car else '' }}" required>
    <label>Seats</label>
    <input type="number" name="seats" value="{{ car.seats if car else 5 }}" required>
    <label>Transmission</label>
    <input type="text" name="transmission" value="{{ car.transmission if car else '' }}" required>
    <label>Price per Day</label>
    <input type="number" name="price_per_day" value="{{ car.price_per_day if car else 2500 }}" required>
    <label>Image URL</label>
    <input type="url" name="image" value="{{ car.image if car else '' }}" required>
    <label class="checkbox-row"><input type="checkbox" name="available" {% if car and car.available %}checked{% elif not car %}checked{% endif %}> Available</label>
    <div class="action-row">
      <button class="btn" type="submit">Save</button>
      <a class="btn secondary" href="{{ url_for('admin_dashboard') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
